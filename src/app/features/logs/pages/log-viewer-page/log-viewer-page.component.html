<div class="log-viewer-page">

  <!-- ===================== -->
  <!-- TOOLBAR -->
  <!-- ===================== -->

  <app-log-toolbar
    [uploadId]="uploadId"
  />

  @if (realtimeUiSync.hasNewLiveLogs()) {

    <div class="live-refresh-banner">

      <div>
        <strong>
          {{ realtimeUiSync.newLiveLogCount() }} new live logs ingested
        </strong>

        <span>
          Refresh this view to pull the latest stored entries and stats.
        </span>
      </div>

      <button
        type="button"
        (click)="refreshLiveLogs()"
      >
        Refresh
      </button>

    </div>
  }
  <!-- ===================== -->
  <!-- STATS -->
  <!-- ===================== -->

  <app-log-stats-bar />

  <!-- ===================== -->
  <!-- CONTENT -->
  <!-- ===================== -->

  <div class="viewer-layout">

    <!-- =================== -->
    <!-- LOG TABLE -->
    <!-- =================== -->

    <div class="table-section">

      <app-log-filters
        [uploadId]="uploadId"
      />

      <app-log-table
        [uploadId]="uploadId"
      />

      <app-log-pagination
        [uploadId]="uploadId"
      />

    </div>

    <!-- =================== -->
    <!-- AI PANEL -->
    <!-- =================== -->

    <div class="ai-section">

      <app-log-ai-panel
        [uploadId]="uploadId"
      />

    </div>

  </div>

</div>
